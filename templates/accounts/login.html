{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}<div class="narrow"><h1>Log in</h1>
<form method="post" class="card pad">{% csrf_token %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% include "partials/form.html" %}
<button class="btn btn-lg btn-block">Log in</button>
<p><a href="{% url 'password_reset' %}">Forgot password?</a> · <a href="{% url 'register' %}">Create account</a></p></form>
<p class="muted small">Use your username or email.</p></div>{% endblock %}
