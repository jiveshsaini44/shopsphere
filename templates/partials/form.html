{% for e in form.non_field_errors %}<p class="err">{{ e }}</p>{% endfor %}
{% for f in form %}
<div class="field {% if f.field.widget.input_type == 'checkbox' %}check{% endif %}">
  {{ f.label_tag }} {{ f }}
  {% if f.help_text %}<small>{{ f.help_text }}</small>{% endif %}
  {% for e in f.errors %}<p class="err">{{ e }}</p>{% endfor %}
</div>
{% endfor %}
