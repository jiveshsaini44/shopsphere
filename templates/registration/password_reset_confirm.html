{% extends "base.html" %}
{% block content %}<div class="narrow"><h1>Choose a new password</h1>
{% if validlink %}<form method="post" class="card pad">{% csrf_token %}{% include "partials/form.html" %}<button class="btn btn-block">Change password</button></form>
{% else %}<p>This link is invalid or expired. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>{% endif %}</div>{% endblock %}
